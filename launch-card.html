<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>BookKraft AI — Product Hunt Launch Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Playfair+Display:ital,wght@0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #b89430;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'DM Sans', sans-serif;
  }

  .card {
    width: 1200px;
    height: 630px;
    background: linear-gradient(140deg, #f5e09a 0%, #e8c84a 45%, #c9a84c 100%);
    border: 4px solid #0F0E0C;
    border-radius: 16px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
  }

  /* Subtle inner glow to lift content off gradient */
  .card::before {
    content: '';
    position: absolute;
    inset: 4px;
    border-radius: 12px;
    background: radial-gradient(ellipse 60% 50% at 50% 40%, rgba(255,248,220,0.38) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Corner brackets */
  .corner {
    position: absolute;
    width: 40px;
    height: 40px;
  }
  .corner-tl { top: 22px; left: 22px;   border-top: 2.5px solid rgba(15,14,12,0.55); border-left: 2.5px solid rgba(15,14,12,0.55); }
  .corner-tr { top: 22px; right: 22px;  border-top: 2.5px solid rgba(15,14,12,0.55); border-right: 2.5px solid rgba(15,14,12,0.55); }
  .corner-bl { bottom: 22px; left: 22px;  border-bottom: 2.5px solid rgba(15,14,12,0.55); border-left: 2.5px solid rgba(15,14,12,0.55); }
  .corner-br { bottom: 22px; right: 22px; border-bottom: 2.5px solid rgba(15,14,12,0.55); border-right: 2.5px solid rgba(15,14,12,0.55); }

  /* Main content stack */
  .content {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  /* Logo icon: dark ink box */
  .logo-wrap {
    width: 84px;
    height: 84px;
    border-radius: 13px;
    overflow: hidden;
    margin-bottom: 14px;
    box-shadow: 0 4px 20px rgba(15,14,12,0.30), 0 1px 4px rgba(15,14,12,0.15);
  }

  .logo-wrap svg { display: block; width: 100%; height: 100%; }

  /* Brand name */
  .brand-name {
    font-family: 'Playfair Display', serif;
    font-size: 24px;
    font-weight: 800;
    color: #0F0E0C;
    letter-spacing: -0.01em;
    margin-bottom: 5px;
  }

  /* "live on Product Hunt today" */
  .brand-sub {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: rgba(15,14,12,0.5);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 26px;
  }

  /* Hairline separator */
  .divider {
    width: 100px;
    height: 1px;
    background: rgba(15,14,12,0.22);
    margin-bottom: 26px;
  }

  /* Hero discount — Playfair italic, commanding */
  .discount {
    font-family: 'Playfair Display', serif;
    font-size: 104px;
    font-weight: 800;
    font-style: italic;
    color: #0F0E0C;
    line-height: 1;
    letter-spacing: -0.03em;
    margin-bottom: 11px;
  }

  /* Subtext below discount */
  .discount-sub {
    font-family: 'DM Sans', sans-serif;
    font-size: 17px;
    font-weight: 500;
    color: rgba(15,14,12,0.6);
    margin-bottom: 26px;
  }

  /* PHLAUNCH pill */
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 11px;
    background: #0F0E0C;
    border-radius: 100px;
    padding: 11px 26px;
    margin-bottom: 22px;
  }

  .pill-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    font-weight: 700;
    color: rgba(201,163,76,0.5);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  .pill-sep {
    width: 1px;
    height: 13px;
    background: rgba(201,163,76,0.28);
    flex-shrink: 0;
  }

  .pill-code {
    font-family: 'DM Sans', sans-serif;
    font-size: 21px;
    font-weight: 800;
    color: #C9933A;
    letter-spacing: 0.06em;
  }

  /* Domain */
  .domain {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: rgba(15,14,12,0.38);
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <div class="card">

    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="content">

      <!-- Logo: inline SVG recoloured for dark bg -->
      <div class="logo-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
          <rect x="0" y="0" width="40" height="40" rx="0" fill="#0F0E0C"/>
          <!-- Left page -->
          <path d="M7,13 C11,11 16,11 20,13 L20,29 C16,27 11,27 7,29 Z" fill="#C9933A"/>
          <!-- Right page -->
          <path d="M33,13 C29,11 24,11 20,13 L20,29 C24,27 29,27 33,29 Z" fill="#C9933A"/>
          <!-- Spine -->
          <line x1="20" y1="13" x2="20" y2="29" stroke="#0F0E0C" stroke-width="1.5"/>
          <!-- AI spark -->
          <circle cx="31" cy="10" r="1.2" fill="#F7F3EC"/>
          <line x1="31" y1="6"    x2="31" y2="8.5"  stroke="#F7F3EC" stroke-width="1.2"/>
          <line x1="31" y1="11.5" x2="31" y2="14"   stroke="#F7F3EC" stroke-width="1.2"/>
          <line x1="27" y1="10"   x2="29.5" y2="10" stroke="#F7F3EC" stroke-width="1.2"/>
          <line x1="32.5" y1="10" x2="35"   y2="10" stroke="#F7F3EC" stroke-width="1.2"/>
        </svg>
      </div>

      <div class="brand-name">BookKraft AI</div>
      <div class="brand-sub">live on Product Hunt today</div>

      <div class="divider"></div>

      <div class="discount">20% OFF</div>
      <div class="discount-sub">for Product Hunt members — first month</div>

      <div class="pill">
        <span class="pill-label">promo code</span>
        <span class="pill-sep"></span>
        <span class="pill-code">PHLAUNCH</span>
      </div>

      <div class="domain">bookkraftai.com</div>

    </div>
  </div>
</body>
</html>
